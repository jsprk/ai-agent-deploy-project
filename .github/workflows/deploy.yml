name: AI Service CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================================
  # CI
  # GitHub-hosted Runner에서 코드 검사
  # =====================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall .


  # =====================================================
  # CD
  # 학생 PC Self-hosted Runner에서 H200 배포
  # =====================================================
  deploy:
    needs: test

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 20

    steps:

      # -------------------------------------------------
      # 1. Self-hosted Runner에 소스 다운로드
      # -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7


      # -------------------------------------------------
      # 2. Runner 환경 확인
      # -------------------------------------------------
      - name: Check Runner environment
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Write-Host "Runner Name  : $env:RUNNER_NAME"
          Write-Host "Runner OS    : $env:RUNNER_OS"
          Write-Host "Windows User : $env:USERNAME"
          Write-Host "User Profile : $env:USERPROFILE"

          ssh -V

          $sshConfig = Join-Path $env:USERPROFILE ".ssh\config"

          if (Test-Path $sshConfig) {
              Write-Host "SSH config found: $sshConfig"
          }
          else {
              throw "SSH config not found: $sshConfig"
          }


      # -------------------------------------------------
      # 3. H200 SSH 접속 확인
      # -------------------------------------------------
      - name: Check H200 connection
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          ssh `
            -o BatchMode=yes `
            -o ConnectTimeout=10 `
            h200 `
            "echo SSH_OK && whoami && hostname"

          if ($LASTEXITCODE -ne 0) {
              throw "H200 SSH connection failed. exit_code=$LASTEXITCODE"
          }


      # -------------------------------------------------
      # 4. 배포 파일 생성
      # -------------------------------------------------
      - name: Create deployment archive
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $archive = "deploy.tar.gz"

          if (Test-Path $archive) {
              Remove-Item $archive -Force
          }

          tar.exe `
            --exclude=.git `
            --exclude=.github `
            --exclude=logs `
            --exclude=deploy.tar.gz `
            -czf $archive .

          if ($LASTEXITCODE -ne 0) {
              throw "Deployment archive creation failed. exit_code=$LASTEXITCODE"
          }

          if (-not (Test-Path $archive)) {
              throw "Deployment archive was not created: $archive"
          }

          Get-Item $archive |
              Format-List Name, Length, LastWriteTime


      # -------------------------------------------------
      # 5. 배포 파일을 H200 서버로 전송
      # -------------------------------------------------
      - name: Upload archive to H200
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          scp `
            -o BatchMode=yes `
            -o ConnectTimeout=10 `
            deploy.tar.gz `
            h200:~/deploy.tar.gz

          if ($LASTEXITCODE -ne 0) {
              throw "Upload to H200 failed. exit_code=$LASTEXITCODE"
          }


      # -------------------------------------------------
      # 6. H200 Docker 배포
      # -------------------------------------------------
      - name: Deploy Docker containers
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          ssh -o BatchMode=yes h200 "set -e; rm -rf ~/llm/ai-agent-deploy-project; mkdir -p ~/llm/ai-agent-deploy-project; tar -xzf ~/deploy.tar.gz -C ~/llm/ai-agent-deploy-project; cp ~/.h200-deploy/.env ~/llm/ai-agent-deploy-project/.env; rm -f ~/deploy.tar.gz; cd ~/llm/ai-agent-deploy-project; docker compose up -d --build"

          if ($LASTEXITCODE -ne 0) {
              throw "Docker deployment failed. exit_code=$LASTEXITCODE"
          }


      # -------------------------------------------------
      # 7. 컨테이너 실행 결과 확인
      # -------------------------------------------------
      - name: Check containers
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          ssh -o BatchMode=yes h200 "cd ~/llm/ai-agent-deploy-project && docker compose ps"

          if ($LASTEXITCODE -ne 0) {
              throw "Container status check failed. exit_code=$LASTEXITCODE"
          }


      # -------------------------------------------------
      # 8. Runner 임시 압축 파일 삭제
      # 성공·실패 여부와 상관없이 실행
      # -------------------------------------------------
      - name: Cleanup Runner archive
        if: always()
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path "deploy.tar.gz") {
              Remove-Item "deploy.tar.gz" -Force
              Write-Host "deploy.tar.gz removed"
          }